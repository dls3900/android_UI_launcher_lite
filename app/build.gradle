plugins { id 'com.android.application' }

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
}

def releaseStoreFile = providers.environmentVariable('STILL_RELEASE_STORE_FILE').orNull
def releaseStorePassword = providers.environmentVariable('STILL_RELEASE_STORE_PASSWORD').orNull
def releaseKeyAlias = providers.environmentVariable('STILL_RELEASE_KEY_ALIAS').orNull
def releaseKeyPassword = providers.environmentVariable('STILL_RELEASE_KEY_PASSWORD').orNull
def signingValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def hasReleaseSigning = signingValues
        .every { it != null && !it.isEmpty() }
if (!hasReleaseSigning && signingValues.any { it != null && !it.isEmpty() }) {
    throw new GradleException('Set all four STILL_RELEASE_* environment variables for release signing.')
}

android {
    namespace 'com.aditya.stilllauncher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aditya.stilllauncher'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
